<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>F1 25 — Overlay OBS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Mono:wght@400;500&display=swap');
  :root{--accent:#9b6cff;--accent-rgb:155,108,255;--green:#73e3a6;--red:#ff7171;--yellow:#f8d574;}
  html,body{margin:0;padding:0;background:transparent;font-family:'Barlow Condensed',sans-serif;color:#f2f3f5;}
  .mono{font-family:'DM Mono',monospace;}
  .card{
    width:360px;background:linear-gradient(180deg,rgba(16,17,22,.92),rgba(10,11,14,.92));
    border:1px solid rgba(var(--accent-rgb),.4);border-radius:12px;padding:14px 16px 12px;
    backdrop-filter:blur(6px);box-shadow:0 18px 40px rgba(0,0,0,.35);
  }
  .card.invalid{border-color:rgba(255,113,113,.65)}
  .top-row{display:flex;align-items:center;gap:10px;}
  .pos{font-size:26px;font-weight:800;color:var(--accent);line-height:1;min-width:34px;}
  .id{flex:1;min-width:0;}
  .id .name{font-size:15px;font-weight:700;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .id .meta{font-size:10px;color:#9096a2;letter-spacing:.5px;margin-top:1px;}
  .invalid-tag{font:9px 'DM Mono',monospace;color:var(--red);background:rgba(255,113,113,.14);border:1px solid rgba(255,113,113,.35);border-radius:5px;padding:3px 6px;letter-spacing:.4px;white-space:nowrap;}
  .lap-time-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;padding-top:11px;border-top:1px solid rgba(255,255,255,.08);}
  .lap-time-row .label{font-size:9px;color:#868c98;letter-spacing:.6px;}
  .lap-time-row .current{font-size:30px;font-weight:700;line-height:1;}
  .lap-time-row .delta{font-size:22px;font-weight:700;line-height:1;text-align:right;}
  .delta.good{color:var(--green)} .delta.loss{color:var(--red)} .delta.flat{color:#9096a2}
  .sub-row{display:flex;justify-content:space-between;margin-top:9px;font-size:11px;color:#c7cad1;}
  .sub-row b{color:#fff;font-weight:600;}
  .sectors{display:flex;gap:6px;margin-top:10px;}
  .sectors span{flex:1;text-align:center;padding:5px 0;border-radius:5px;background:#1b1d24;font:10px 'DM Mono',monospace;color:#8d939e;border:1px solid rgba(255,255,255,.05);}
  .sectors span.good{color:var(--green);border-color:rgba(115,227,166,.3);background:rgba(115,227,166,.08);}
  .sectors span.loss{color:var(--red);border-color:rgba(255,113,113,.3);background:rgba(255,113,113,.08);}
  .stat-row{display:flex;align-items:center;gap:12px;margin-top:11px;}
  .stat{display:flex;flex-direction:column;}
  .stat small{font-size:8px;color:#767c88;letter-spacing:.5px;}
  .stat b{font-size:16px;line-height:1.1;}
  .gear-badge{width:26px;height:26px;border-radius:6px;background:var(--accent);color:#101014;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
  .drs{margin-left:auto;font:9px 'DM Mono',monospace;letter-spacing:.5px;padding:4px 7px;border-radius:5px;background:#1b1d24;color:#5e6370;border:1px solid rgba(255,255,255,.06);}
  .drs.on{color:#101014;background:var(--green);border-color:var(--green);}
  .tyre-row{display:flex;align-items:center;gap:8px;margin-top:11px;}
  .tyre-dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:9px 'DM Mono',monospace;font-weight:700;color:#101014;flex:none;}
  .wear-bar{flex:1;height:5px;border-radius:3px;background:#232630;overflow:hidden;}
  .wear-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--yellow) 70%,var(--red));width:0%;transition:width .2s ease;}
  .wear-pct{font:10px 'DM Mono',monospace;color:#c7cad1;min-width:30px;text-align:right;}
  .speed-bar{height:6px;border-radius:4px;background:#1c1e26;margin-top:11px;overflow:hidden;}
  .speed-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--green));width:0%;transition:width .12s ease;}

  /* Preset compact : ?preset=compact dans l'URL du browser source OBS.
     Ne garde que l'essentiel (position, nom, tour en cours, delta, meilleur
     tour) pour un encombrement d'écran minimal. */
  .compact .card{width:280px;padding:10px 14px 10px;}
  .compact .sectors,
  .compact .stat-row,
  .compact .tyre-row,
  .compact .speed-bar{display:none;}
  .compact .sub-row{margin-top:6px;font-size:10px;}
  .compact .lap-time-row .current{font-size:24px;}
  .compact .lap-time-row .delta{font-size:18px;}
  .compact #recordToast{width:320px;margin-left:-160px;padding:12px 16px;}
  .compact #recordToast .toast-driver{font-size:16px;}
  .compact #recordToast .toast-time{font-size:20px;}

  /* Notification de nouveau record */
  #recordToast{
    position:fixed;top:28px;left:50%;
    width:420px;margin-left:-210px;
    background:linear-gradient(180deg,rgba(20,17,10,.95),rgba(12,10,6,.95));
    border:1px solid rgba(248,213,116,.55);border-radius:14px;
    padding:16px 20px;box-shadow:0 0 0 0 rgba(248,213,116,.4),0 20px 45px rgba(0,0,0,.45);
    opacity:0;pointer-events:none;transform:translateY(-24px) scale(.96);
    transition:opacity .35s ease,transform .35s ease;
    z-index:50;
  }
  #recordToast.show{opacity:1;transform:translateY(0) scale(1);animation:recordGlow 1.4s ease-out;}
  @keyframes recordGlow{
    0%{box-shadow:0 0 0 0 rgba(248,213,116,.55),0 20px 45px rgba(0,0,0,.45);}
    50%{box-shadow:0 0 34px 6px rgba(248,213,116,.45),0 20px 45px rgba(0,0,0,.45);}
    100%{box-shadow:0 0 0 0 rgba(248,213,116,0),0 20px 45px rgba(0,0,0,.45);}
  }
  #recordToast .toast-top{display:flex;align-items:center;gap:8px;}
  #recordToast .flag{font-size:18px;line-height:1;}
  #recordToast .toast-label{font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--yellow);}
  #recordToast .toast-driver{margin-top:6px;font-size:20px;font-weight:800;letter-spacing:.3px;color:#fff;}
  #recordToast .toast-sub{margin-top:2px;font-size:11px;color:#c7cad1;}
  #recordToast .toast-bottom{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);}
  #recordToast .toast-time{font-size:26px;font-weight:700;}
  #recordToast .toast-gain{font-size:16px;font-weight:700;color:var(--green);text-align:right;}
</style>
</head>
<body>
  <div id="recordToast">
    <div class="toast-top"><span class="flag">🏁</span><span class="toast-label mono">NOUVEAU RECORD PERSONNEL</span></div>
    <div class="toast-driver" id="toastDriver">—</div>
    <div class="toast-sub" id="toastTrack">—</div>
    <div class="toast-bottom">
      <div class="toast-time mono" id="toastTime">0:00.000</div>
      <div class="toast-gain mono" id="toastGain">-0.000</div>
    </div>
  </div>
  <div class="card" id="card">
    <div class="top-row">
      <span class="pos mono" id="pos">P—</span>
      <div class="id"><div class="name" id="name">—</div><div class="meta" id="lapMeta">TOUR — / —</div></div>
      <span class="invalid-tag" id="invalidTag" hidden>TOUR INVALIDE</span>
    </div>
    <div class="lap-time-row">
      <div><div class="label">TOUR EN COURS</div><div class="current mono" id="currentLap">0:00.000</div></div>
      <div><div class="label">DELTA</div><div class="delta mono" id="deltaLive">—.———</div></div>
    </div>
    <div class="sub-row">
      <span>Dernier <b class="mono" id="lastLap">—</b></span>
      <span>Meilleur <b class="mono" id="bestLap">—</b></span>
    </div>
    <div class="sectors">
      <span id="s1">S1</span><span id="s2">S2</span><span id="s3">S3</span>
    </div>
    <div class="stat-row">
      <div class="gear-badge mono" id="gear">N</div>
      <div class="stat"><small>VITESSE</small><b class="mono" id="speed">0 <span style="font-size:10px;color:#767c88">km/h</span></b></div>
      <div class="stat"><small>ERS</small><b class="mono" id="ers">0%</b></div>
      <span class="drs" id="drs">DRS</span>
    </div>
    <div class="tyre-row">
      <div class="tyre-dot" id="tyreDot">S</div>
      <div class="wear-bar"><i id="wearFill"></i></div>
      <span class="wear-pct mono" id="wearPct">0%</span>
    </div>
    <div class="speed-bar"><i id="speedBar"></i></div>
  </div>
<script src="js/overlay.js"></script>
</body>
</html>
